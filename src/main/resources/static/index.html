<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criminal Data Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside>
    <h1>Records Office</h1>
    <p class="sub">Criminal Data Management</p>
    <nav>
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="criminals">Criminals</button>
      <button data-view="cases">Cases</button>
    </nav>
    <div class="user"><span id="who"></span><button id="logout" class="link-light">Sign out</button></div>
  </aside>

  <main>
    <header>
      <h2 id="title">Dashboard</h2>
      <input id="search" type="search" placeholder="Search records" aria-label="Search records">
      <button id="add" class="primary">Add criminal</button>
    </header>
    <div id="dash"></div>
    <div class="table-wrap"><table id="table"></table></div>
  </main>

  <dialog id="dlg"><form id="form"></form></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
